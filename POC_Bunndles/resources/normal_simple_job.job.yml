resources:
  jobs:
    normal_simple_job:
      name: normal_simple_job
      tasks:
        - task_key: first_notebook
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: /Workspace/Repos/repo_databricks_workflows/MapsMultichoise/POC_Bunndles/src/normal_simple_job/Free Company Dataset | People Data Labs
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
